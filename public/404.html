<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect script
        (function() {
            const basePath = '/viso';
            const path = window.location.pathname;
            const search = window.location.search;
            const hash = window.location.hash;
            const normalizedPath = path.startsWith(basePath) ? (path.slice(basePath.length) || '/') : path;
            
            // Check if this is a route that should go to db.html
            if (normalizedPath.includes('db.html') || search.includes('analise=')) {
                window.location.replace(basePath + '/db.html' + search + hash);
            }
            // Check if this is a deputado or empresa route that should go to index.html
            else if (normalizedPath.includes('deputado-') || normalizedPath.includes('empresa-')) {
                const params = new URLSearchParams(search);
                params.set('node', normalizedPath.replace(/^\//, ''));
                window.location.replace(basePath + '/index.html?' + params.toString() + hash);
            }
            // Default fallback to index.html
            else {
                window.location.replace(basePath + '/index.html' + search + hash);
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
