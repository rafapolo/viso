<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sankey Diagram - Despesas</title>
    <script src="vendor/js/d3.v7.min.js"></script>
    <script src="vendor/js/d3-sankey.min.js"></script>
    <link rel="stylesheet" href="src/styles/sankey.css">
</head>
<body>
    <h1>Fluxo: Partido → Categoria de Despesa → Fornecedor</h1>
    <p>Visualização dos fornecedores com mais de 100 registros</p>
    
    <div id="stats" class="stats" style="display: none;">
        <div>Total de partidos: <span id="totalPartidos">0</span></div>
        <div>Total de categorias: <span id="totalCategorias">0</span></div>
        <div>Total de fornecedores: <span id="totalFornecedores">0</span></div>
        <div>Valor total: <span id="totalRegistros">R$ 0</span></div>
    </div>
    <div id="loading">Carregando dados...</div>
    <svg id="sankey" width="1200" height="800"></svg>

    <script type="module" src="src/apps/sankey-app.js"></script>
</body>
</html>
